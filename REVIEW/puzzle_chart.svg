ddle">Sketch S5 star line</text><rect x="960" y="366" width="190" height="46" rx="6" fill="#e8e8e8" stroke="#333"/><text x="1055" y="393" text-anchor="middle">Comet · Tiny lighthouse</text><rect x="1190" y="144" width="190" height="46" rx="6" fill="#f2b75b" stroke="#333"/><text x="1285" y="171" text-anchor="middle">Take light (crater)</text><circle cx="1372" cy="152" r="7" fill="#d23b2f" stroke="#333"/><rect x="1190" y="218" width="190" height="46" rx="6" fill="#f2b75b" stroke="#333"/><text x="1285" y="245" text-anchor="middle">Light in old lamp (rise)</text><circle cx="1372" cy="226" r="7" fill="#e8a23b" stroke="#333"/><rect x="1190" y="292" width="190" height="46" rx="6" fill="#9fb0ff" stroke="#333"/><text x="1285" y="319" text-anchor="middle">Dive: moon edge</text><circle cx="1372" cy="300" r="7" fill="#e8a23b" stroke="#333"/><rect x="1190" y="70" width="190" height="46" rx="6" fill="#f1e6cf" stroke="#333"/><text x="1285" y="97" text-anchor="middle">Sketch S6 harbor below</text><rect x="1190" y="366" width="190" height="46" rx="6" fill="#e8e8e8" stroke="#333"/><text x="1285" y="393" text-anchor="middle">Footprint · Glove</text><rect x="1420" y="218" width="190" height="46" rx="6" fill="#bfe3c0" stroke="#333"/><text x="1515" y="245" text-anchor="middle">Ending: street at night</text><text x="40" y="534" font-size="13" font-weight="bold">Stuck points</text><circle cx="46" cy="546" r="5" fill="#e8a23b" stroke="#333"/><text x="58" y="550">Dive: open shop door: Only the glow says the door is enterable</text><circle cx="46" cy="562" r="5" fill="#d23b2f" stroke="#333"/><text x="58" y="566">Take key (counter): Key is a tiny thing on the counter; nothing points to it (fixed this round: sketchbook page + glint on rattle)</text><circle cx="46" cy="578" r="5" fill="#e8a23b" stroke="#333"/><text x="58" y="582">Unlock blue drawer: Locked drawer rattles and shows a keyhole; which drawer is the only colour cue</text><circle cx="46" cy="594" r="5" fill="#d23b2f" stroke="#333"/><text x="58" y="598">Open envelope (letter hill): Envelope with its flap up is on the letter hill, not visible from arrival; must walk up</text><circle cx="46" cy="610" r="5" fill="#d23b2f" stroke="#333"/><text x="58" y="614">Feather on cat nose: "Use feather on nose" is not signposted; the cat is a shape across the drawer</text><circle cx="46" cy="626" r="5" fill="#d23b2f" stroke="#333"/><text x="58" y="630">Feather on ear (look up): The ear is 45° up; players rarely look up</text><circle cx="46" cy="642" r="5" fill="#d23b2f" stroke="#333"/><text x="58" y="646">Cover reflected lamp: "Cover the reflected lamp" is abstract; nothing shows that the pupil widens in the dark</text><circle cx="46" cy="658" r="5" fill="#d23b2f" stroke="#333"/><text x="58" y="662">Take light (crater): The light is a spark in a small crater; needs zoom to see</text><circle cx="46" cy="674" r="5" fill="#e8a23b" stroke="#333"/><text x="58" y="678">Light in old lamp (rise): Empty socket + rattle say "put something in"; the rise must be climbed</text><circle cx="46" cy="690" r="5" fill="#e8a23b" stroke="#333"/><text x="58" y="694">Dive: moon edge: The edge opening is below the rise; must look down</text><text x="40" y="718" font-size="11" fill="#555">Optional finds (dashed) never block. Sketches lock from the spot they were drawn from; hidden things need zoom. The feather is carried from the drawer into the cat. Back out is always available.</text></svg>